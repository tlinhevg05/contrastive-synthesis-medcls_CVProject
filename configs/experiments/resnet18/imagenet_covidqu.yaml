experiment_id: resnet18_imagenet_covidqu
backbone: resnet18
pretraining_strategy: imagenet_covidqu
contrastive_method: simclr

pretrain:
  enabled: true
  init: imagenet
  dataset: real_unlabeled
  checkpoint_path: results/experiments/resnet18_imagenet_covidqu/pretrain/checkpoints/best_simclr_backbone.pth
  epochs: 70
  batch_size: 64
  learning_rate: 0.0005

finetune:
  init: contrastive_checkpoint
  checkpoint_path: results/experiments/resnet18_imagenet_covidqu/pretrain/checkpoints/best_simclr_backbone.pth
  epochs: 70
  batch_size: 32
  learning_rate: 0.00001
  weight_decay: 0.01
  freeze_backbone: false

output_dir: results/experiments/resnet18_imagenet_covidqu
